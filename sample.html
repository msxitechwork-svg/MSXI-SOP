var $=function(i){return document.getElementById(i)};
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(s){var a=atob(s),u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function normId(s){s=String(s||'').trim().toLowerCase();if(s.indexOf('@')<0){s=s.replace(/\D/g,'');if(s.length>10)s=s.slice(-10)}return s}
function normPw(s){return String(s||'').toUpperCase().replace(/[\s-]/g,'')}
async function tag(id){return hex(await crypto.subtle.digest('SHA-256',enc.encode(id))).slice(0,12)}
async function unwrap(rec,id,pw){
  var km=await crypto.subtle.importKey('raw',enc.encode(id+'|'+pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(rec.s),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(rec.i)},k,b64(rec.w)));
}
async function open(raw){
  var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.pi)},k,b64(D.p)));
  document.open();document.write(html);document.close();
}
var KEY='sopk:'+D.v;
try{var saved=JSON.parse(sessionStorage.getItem(KEY)||'null');
  if(saved&&saved.exp>Date.now()){
    $('f').style.visibility='hidden';
    var go=function(){setTimeout(function(){open(b64(saved.k)).catch(function(){sessionStorage.removeItem(KEY);$('f').style.visibility='visible'})},0)};
    if(document.readyState==='complete')go();else window.addEventListener('load',go);
  }}catch(e){}
$('f').addEventListener('submit',async function(e){
  e.preventDefault();var b=$('b'),er=$('err');er.textContent='';b.disabled=true;b.textContent='Checking…';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('This browser is not supported. Please open the link in Chrome, Edge, Safari or Firefox over https.');
    var id=normId($('u').value),pw=normPw($('p').value),t=await tag(id),recs=D.r.filter(function(r){return r.t===t}),raw=null;
    for(var i=0;i<recs.length&&!raw;i++){try{raw=await unwrap(recs[i],id,pw)}catch(x){}}
    if(!raw){er.textContent='Email / mobile or password is incorrect.';b.disabled=false;b.textContent='Open the SOP';return}
    try{sessionStorage.setItem(KEY,JSON.stringify({k:btoa(String.fromCharCode.apply(null,raw)),exp:Date.now()+12*36e5}))}catch(x){}
    await open(raw);
  }catch(x){er.textContent=x.message||'Something went wrong.';b.disabled=false;b.textContent='Open the SOP'}
});
})();
